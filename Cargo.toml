[package]
name = "avernus"
version = "0.1.0"
edition = "2024"

[dependencies]
matrix-sdk = { version = "0.18", default-features = false, features = ["sqlite", "e2e-encryption", "sso-login"] }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
tokio = { version = "1.53.1", features = ["full"] }
smol = "2.0.2"
open = "5.4.1"
serde_json = "1.0"
rfd = "0.15"
mime = "0.3"
mime_guess = "2.0"
futures-util = "0.3"
